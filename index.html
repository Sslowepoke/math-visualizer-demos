<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physics &amp; Math Demos</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #232a2e;
      --fg: #d3c6aa;
      --muted: #7a8478;
      --accent: #a7c080;
      --card: #2c3337;
      --border: #3a4248;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
      color: var(--accent);
    }

    .subtitle {
      margin: 0 0 2rem;
      color: var(--muted);
    }

    .demo-list {
      display: grid;
      gap: 1rem;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .demo-card {
      display: block;
      padding: 1.25rem 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s;
    }

    .demo-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .demo-card h2 {
      margin: 0 0 0.35rem;
      font-size: 1.1rem;
      color: var(--accent);
    }

    .demo-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Physics &amp; Math Demos</h1>
    <p class="subtitle">Interactive Three.js visualizations</p>
    <ul class="demo-list" id="demo-list"></ul>
  </main>

  <script>
    const siteBase = "__SITE_BASE__";
    const isPlaceholder = siteBase.startsWith("__");

    fetch(isPlaceholder ? "demos.json" : `${siteBase}/demos.json`)
      .then((r) => r.json())
      .then((demos) => {
        const list = document.getElementById("demo-list");
        for (const demo of demos) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.className = "demo-card";
          a.href = isPlaceholder
            ? `${demo.slug}/`
            : `${siteBase}/${demo.slug}/`;

          const title = document.createElement("h2");
          title.textContent = demo.title;
          const description = document.createElement("p");
          description.textContent = demo.description;
          a.append(title, description);

          li.appendChild(a);
          list.appendChild(li);
        }
      })
      .catch(() => {
        const list = document.getElementById("demo-list");
        const li = document.createElement("li");
        li.textContent = "Could not load demos.json.";
        list.appendChild(li);
      });
  </script>
</body>
</html>
